[project]
name = "dataforge"
version = "0.6.0"
description = "PV_DataForge — Python + Vue + SQLite ETL test-data generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
# Optional bulk helpers (not required for core app)
bulk = ["polars>=1.0.0", "numpy>=2.0.0"]

[tool.uv]
# Prefer Python 3.14 when installed; 3.12+ is supported today.
dev-dependencies = []
